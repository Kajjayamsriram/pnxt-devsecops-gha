  ###########################
  # 1. Static checks -linting,trivy
  ###########################
  ###########################
  # 2. Install + tests -npm tests
  ###########################
  ###########################
  # 3. SonarQube
  ###########################
  ###########################
  # 4. Build, image scan, smoke test
  ###########################
  ###########################
  # 5. Push (main only, after everything passes)
  ###########################
on:
    push:
        branches:
            - main
jobs:
    build-job:
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@v7
            - name: setup buildx
              uses: docker/setup-buildx-action@v3
            - name: build image
              uses: docker/build-push-action@v6
              with:
                context: .
                file: Dockerfile
                push: false
                load: true
                outputs: type=docker,dest=/tmp/image.tar
                tags: |
                   sriramk16/zomato-gha:latest
                cache-from: |
                   type=gha,scope=${{github.ref}}
                cache-to: type=gha,mode=min,scope=${{github.ref}}
            - name: check image exists locally
              run: docker image ls sriramk16/zomato-gha:latest

            - name: Image scan
              uses: snyk/actions/docker@master
              env:
                SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
              with:
                image: sriramk16/zomato-gha:latest
                args: --severity-threshold=critical
            - name: upload artifact
              uses: actions/upload-artifact@v4
              with:
                name: image
                path: /tmp/image.tar
                retention-days: 1
    smoke-job:
        runs-on: ubuntu-latest
        needs: build-job
        steps:
            - name: download artifact
              uses: actions/download-artifact@v4
              with:
                name: image
                path: /tmp
            - name: smoke test
              run: |
                docker load -i /tmp/image.tar
                docker run -d -p 3000:3000 sriramk16/zomato-gha:latest
                sleep 5
                curl http://localhost:3000
              